services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn mdl_ml.app:app --host 0.0.0.0 --port 8000 --workers 4"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-postgres}
      PROVIDER_ALPHA_URL: http://alpha:8000
      PROVIDER_BETA_URL: http://beta:8000
      PUBLIC_CALLBACK_BASE_URL: http://api:8000
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-60}
      PROVIDER_HTTP_TIMEOUT_SECONDS: ${PROVIDER_HTTP_TIMEOUT_SECONDS:-5}
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      alpha:
        condition: service_healthy
      beta:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  alpha:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "mdl_ml.fake_provider:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_NAME: alpha
      PUBLIC_CALLBACK_BASE_URL: http://api:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-postgres}
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  beta:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "mdl_ml.fake_provider:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_NAME: beta
      PUBLIC_CALLBACK_BASE_URL: http://api:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-postgres}
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
